name: Publish .NET Package

on:
  push:
    tags:
      - "dotnet-v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(dotnet msbuild dotnet/NathbrokRestSdk.csproj -getProperty:Version)"
          export PACKAGE_VERSION
          python3 -c "import os; expected='dotnet-v' + os.environ['PACKAGE_VERSION']; actual=os.environ['RELEASE_TAG']; assert actual==expected, f'Expected tag {expected}, got {actual}'"

      - name: Restore with locked dependencies
        run: dotnet restore dotnet/tests/NathbrokRestSdk.SmokeTests.csproj --locked-mode

      - name: Run .NET SDK smoke tests
        run: dotnet run --project dotnet/tests/NathbrokRestSdk.SmokeTests.csproj --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack dotnet/NathbrokRestSdk.csproj --configuration Release --no-restore

      - name: Verify NuGet publishing identity is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "Configure the NUGET_USER repository secret with the NuGet profile username used by the trusted publishing policy." >&2
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NuGet OIDC login did not provide a temporary API key." >&2
            exit 1
          fi
          dotnet nuget push dotnet/bin/Release/NathbrokRestSdk.*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
