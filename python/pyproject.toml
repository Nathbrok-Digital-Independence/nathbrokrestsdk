[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nathbrokrestsdk"
version = "1.0.3"
description = "Python SDK for Nathbrok file, chat, and server SSO APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "requests>=2.31"]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://docs.nathbrok.com/sdk/v1/"
Issues = "https://docs.nathbrok.com/sdk/v1/issues/"
License = "https://opensource.org/license/mit/"
